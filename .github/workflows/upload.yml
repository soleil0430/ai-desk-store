# 앱에서 올린 캐릭터 PR 을 검사해 바로 머지하고 목록(index.json)을 갱신한다.
# pull_request_target 은 저장소 권한으로 돈다. 그래서 PR 의 파일은 내려받지도 실행하지도 않고,
# 바뀐 파일 목록과 크기만 GitHub API 로 읽는다. 검사 스크립트는 기본 브랜치(main)의 것을 쓴다.
name: upload
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
concurrency: store
permissions:
  contents: write
  pull-requests: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 검사
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | "\(.status) \(.filename)"' > "$RUNNER_TEMP/changes.txt"
          id=$(awk 'NR==1 { split($2, p, "/"); print p[2] }' "$RUNNER_TEMP/changes.txt")
          : > "$RUNNER_TEMP/listing.txt"
          if [[ "$id" =~ ^[a-z0-9-]+$ ]]; then
            gh api "repos/$HEAD_REPO/contents/characters/$id?ref=$HEAD_SHA" \
              --jq '.[] | select(.type == "file") | "\(.name) \(.size)"' > "$RUNNER_TEMP/listing.txt" || true
          fi
          if out=$(scripts/check-pr.sh "$AUTHOR" "$RUNNER_TEMP/changes.txt" "$RUNNER_TEMP/listing.txt"); then
            echo "id=$out" >> "$GITHUB_OUTPUT"
          else
            gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --comment "올리기 실패: $out"
            exit 1
          fi
      - name: 머지하고 목록 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ID: ${{ steps.check.outputs.id }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
          git pull --ff-only origin main
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          meta="characters/$ID/meta.json"
          if [ -f "$meta" ]; then
            jq --arg t "$now" '.updatedAt = $t' "$meta" > "$meta.tmp" && mv "$meta.tmp" "$meta"
          else
            jq -n --arg a "$AUTHOR" --arg t "$now" '{author: $a, addedAt: $t, updatedAt: $t}' > "$meta"
          fi
          scripts/build-index.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "목록 갱신: $ID"
          git push origin main
